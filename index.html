<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a050c">
<title>Apoorva &amp; Armaan · 17–18 January 2027</title>
<meta name="description" content="With the blessings of our families — Apoorva & Armaan, 17 & 18 January 2027, New Delhi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--deep:#3a050c;--gold2:#f3d79a;--ink:#7b1b20;--script:"Playfair Display",Georgia,"Times New Roman",serif;--serif:"Cormorant Garamond",Georgia,serif;
  --colW:100vw;--stageH:100vh}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--deep);scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:var(--deep);font-family:var(--serif);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body.locked{overflow:hidden;height:100%}
img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#spacer{width:1px}

/* ---------- stage: one screen, sized to the phone in hand ---------- */
#stage,#hook{position:fixed;top:0;left:50%;width:var(--colW);height:var(--stageH);transform:translateX(-50%)}
#stage{z-index:1;overflow:hidden;background:var(--deep);container-type:inline-size}
.scene{position:absolute;inset:0;visibility:hidden;pointer-events:none;overflow:visible;transform-origin:50% 45%;will-change:transform;backface-visibility:hidden}
.scene.on{visibility:visible}
.scene.cur{pointer-events:auto}
.scene .fillT,.scene .fillB{position:absolute;left:0;right:0;height:50%}
.scene .fillT{top:0}.scene .fillB{bottom:0}
.scene .inner{position:absolute;inset:0;overflow:hidden}
.scene .cap{position:absolute;left:0;right:0;bottom:100%;height:30cqw;pointer-events:none}
.scene .cap canvas{display:block;width:100%;height:100%}
html{scroll-snap-type:y mandatory}
#spacer{position:relative}
.snap{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start;scroll-snap-stop:always}
.scene .ext{position:absolute;left:0;width:100%;height:auto}
.scene .shade{position:absolute;inset:0;background:#2a0308;opacity:0;pointer-events:none;z-index:40}
.sec{position:absolute;left:0;width:100%;container-type:inline-size}
.panel{position:relative;width:100%;height:100%}
.panel .base{display:none}

/* ---------- title cards between scenes ---------- */
#hook{z-index:25;pointer-events:none;overflow:hidden;container-type:inline-size}
#vig{position:absolute;inset:0;background:#2a0308;opacity:0}
#tc{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);text-align:center;color:#f3d79a;opacity:0}
#tc .bs{display:block;font-family:var(--script);font-size:10.6cqw;line-height:1.3;white-space:nowrap}
#tc .bc{display:block;font-weight:600;font-size:3cqw;letter-spacing:.38em;padding-left:.38em;text-transform:uppercase;margin-top:1cqw}

/* script headings typeset over the cards (Mehendi typography) */
.script{position:absolute;z-index:11;transform:translate(-50%,-50%);font-family:var(--script);line-height:1.3;white-space:nowrap;padding:0 .35em;pointer-events:none;
  clip-path:inset(0 100% 0 0)}
.sec.in .script{animation:write 2.4s cubic-bezier(.5,.1,.3,1) var(--wd,.2s) forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.caps{position:absolute;z-index:11;transform:translate(-50%,-50%);font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.5em;padding-left:.5em;opacity:0;transition:opacity 1.4s 1.2s;pointer-events:none}
.sec.in .caps{opacity:1}

/* readable text typeset over the artwork */
.tx{position:absolute;z-index:11;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1.25;white-space:nowrap;color:#6b2a26;font-family:var(--serif);font-weight:500;pointer-events:none;opacity:0;transition:opacity 1.2s ease .2s}
.sec.in .tx{opacity:1}
.tx.lt{color:#f6e3b4;text-shadow:0 1px 3px rgba(40,10,0,.35)}
.tx.ttl{font-family:var(--script);font-weight:600;line-height:1.1;color:#f3d79a;text-shadow:0 2px 6px rgba(40,10,0,.3)}
.tx.uc{font-weight:600;text-transform:uppercase;letter-spacing:.14em;padding-left:.14em}
.uph{position:absolute;z-index:8;pointer-events:none}
.uph img{width:100%;height:auto}
.tx.row{display:flex;align-items:baseline;width:70%;font-size:4.2cqw;font-weight:600;letter-spacing:.04em}
.tx.row b{flex:1;min-width:4cqw;margin:0 2cqw;border-bottom:.5cqw dotted currentColor;opacity:.55;transform:translateY(-.3em)}
.tx.row span:last-child{font-weight:700;font-size:1.16em;color:#f3d79a;letter-spacing:.02em}
.plq{position:absolute;z-index:11;transform:translate(-50%,-50%);aspect-ratio:300/100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(30,10,0,.28));opacity:0;transition:opacity 1.2s ease .4s}
.sec.in .plq{opacity:1}
.plq svg{position:absolute;inset:0;width:100%;height:100%}
.plq>*:not(svg){position:relative}
.plq b{font-family:var(--serif);font-weight:600;font-size:2.9cqw;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#8a5a1e}
.plq span{font-family:var(--script);font-weight:600;font-size:var(--fs,4.8cqw);line-height:1.15;color:var(--ac);white-space:nowrap;margin:.6cqw 0 1.4cqw}
.plq em{display:flex;gap:1.6cqw}
.plq u{display:block;width:3.8cqw;height:3.8cqw;border-radius:50%;box-shadow:0 0 0 .35cqw #fff8ea,0 0 0 .6cqw #c9a24a}
.plq .fl{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;color:#b8862e;font-size:3.6cqw}
.plq .fl.l{left:5%}.plq .fl.r{right:5%}
.tx i.ln{display:inline-block;width:7.5cqw;height:1px;background:currentColor;vertical-align:middle;margin:0 1.6cqw;opacity:.75}
.varch{display:block;width:100%;height:100%}
.vsprig{display:block;width:100%;height:auto}
.tx.sw{display:flex;gap:1.8cqw}
.tx.sw u{display:block;width:4.2cqw;height:4.2cqw;border-radius:50%;box-shadow:0 0 0 .4cqw #fff8ea,0 0 0 .7cqw #c9a24a}
.rgem{position:absolute;z-index:9;width:25%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,20,.45));animation:rgf 6s ease-in-out infinite}
.rgem svg{display:block;width:100%;height:auto}
@keyframes rgf{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-54%)}}
.sglow{position:absolute;z-index:9;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,236,170,.55) 0,rgba(255,220,140,.18) 35%,transparent 70%);mix-blend-mode:screen;animation:sglow 3.6s ease-in-out infinite}
@keyframes sglow{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.85)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.fairy{position:absolute;z-index:9;width:2.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fffbe6 0,rgba(255,230,160,.85) 30%,rgba(255,210,120,0) 70%);mix-blend-mode:screen;animation:fairy 2.6s ease-in-out infinite}
@keyframes fairy{0%,100%{opacity:.25}50%{opacity:1}}
.vbtn{position:absolute;z-index:14;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:1.4cqw;padding:1.3cqw 3.6cqw;border:1px solid #7a1d24;border-radius:999px;
  background:#fffaf1;color:#7a1d24;font:600 2.6cqw/1 var(--serif);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;white-space:nowrap;pointer-events:auto;opacity:0;transition:opacity 1.2s .3s}
.sec.in .vbtn{opacity:1}
.tel{position:absolute;z-index:14;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:1.6cqw;font:500 3.7cqw/1 var(--serif);letter-spacing:.08em;color:#7a1d24;text-decoration:none;white-space:nowrap;pointer-events:auto;opacity:0;transition:opacity 1.2s .5s}
.sec.in .tel{opacity:1}
.tel svg{width:3.6cqw;height:3.6cqw}
.vbtn svg{width:2.8cqw;height:2.8cqw}
.h15{position:absolute;z-index:12;width:13.4%;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.h15 img{display:block;width:100%;height:auto}
.h15 b{position:absolute;left:0;right:0;top:45%;transform:translateY(-50%);text-align:center;font:500 3.6cqw/1 var(--serif);color:#fff6ea}
.tx.dev{font-family:"Tiro Devanagari Hindi","Kohinoor Devanagari","Noto Serif Devanagari",serif;font-weight:400}
.tx.orn{display:flex;align-items:center;gap:2.4cqw;color:#c9a24a;font-size:3cqw}
.tx.orn i{display:block;width:12cqw;height:1px;background:linear-gradient(90deg,transparent,#c9a24a)}
.tx.orn i+i{background:linear-gradient(90deg,#c9a24a,transparent)}
.tx sup{font-size:.55em;letter-spacing:.05em;vertical-align:.7em}

/* ---------- the illustrations themselves come alive ---------- */
.spr{position:absolute;z-index:10;opacity:0;cursor:pointer;pointer-events:auto;will-change:transform}
.spr img{width:100%;height:auto;transform-origin:50% 60%;animation:hover var(--hd,4.2s) ease-in-out var(--hdel,0s) infinite alternate}
.spr.flying img{animation:flap .17s ease-in-out infinite alternate}
@keyframes hover{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(2%,-7%) rotate(-3deg)}100%{transform:translate(-2%,-2%) rotate(2deg)}}
@keyframes flap{from{transform:scaleY(1) translateY(0)}to{transform:scaleY(.7) scaleX(1.05) translateY(7%)}}
.el{position:absolute;z-index:9;pointer-events:auto;cursor:pointer;will-change:transform}
.el img{width:100%}
/* plants & garlands sway from where they grow, and catch the light */
.sway{animation:sway var(--sd,5s) ease-in-out var(--sdl,0s) infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--amp,2deg) * -1))}to{transform:rotate(var(--amp,2deg))}}
.shine img{animation:shine var(--shd,7s) ease-in-out var(--shl,0s) infinite}
@keyframes shine{0%,80%,100%{filter:none}88%{filter:brightness(1.18) saturate(1.12)}}
.walk{animation:walk var(--wk,16s) ease-in-out infinite}
.walk img{animation:step .9s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes walk{0%{transform:translateX(0) scaleX(1)}46%{transform:translateX(var(--dist,8%)) scaleX(1)}50%{transform:translateX(var(--dist,8%)) scaleX(-1)}96%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes step{from{transform:translateY(0) rotate(-.8deg)}to{transform:translateY(-2.2%) rotate(.8deg)}}
.star{animation:twinkle 4.5s ease-in-out infinite}
.star img{transform-origin:50% 50%}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);filter:none}50%{transform:scale(1.08) rotate(8deg);filter:brightness(1.2)}}
.lamp{position:absolute;z-index:10;transform-origin:50% 0;animation:swing var(--sd,3.6s) ease-in-out infinite alternate;cursor:pointer}
.lamp img{width:100%;transform-origin:50% 0}
@keyframes swing{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.sun{position:absolute;z-index:9;pointer-events:auto;cursor:pointer;animation:sunsway 9s ease-in-out infinite}
.sun img{width:100%}
@keyframes sunsway{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.05)}}
.perch{position:absolute;z-index:10;cursor:pointer;transform-origin:var(--px,50%) 100%;animation:perch var(--pd,5.5s) ease-in-out var(--pdel,0s) infinite}
.perch img{width:100%}
@keyframes perch{0%,100%{transform:rotate(0)}14%{transform:rotate(-4deg)}22%{transform:rotate(-2deg)}30%{transform:rotate(-4.5deg)}44%{transform:rotate(0)}58%{transform:rotate(3deg)}63%{transform:rotate(0) translateY(-4%)}67%{transform:rotate(0)}80%{transform:rotate(2deg)}}
.peahead{position:absolute;z-index:10;transform-origin:60% 100%;animation:peck 6s ease-in-out infinite;cursor:pointer}
.peahead img{width:100%}
@keyframes peck{0%,100%{transform:rotate(0)}12%{transform:rotate(-6deg)}22%{transform:rotate(-3deg)}30%{transform:rotate(-6.5deg)}45%{transform:rotate(1deg)}60%{transform:rotate(4deg)}68%{transform:rotate(2deg)}76%{transform:rotate(4deg)}88%{transform:rotate(0)}}
.hot{position:absolute;z-index:14;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;pointer-events:auto}
.heartspr{position:absolute;z-index:12;opacity:0;cursor:pointer;pointer-events:auto;transform-origin:50% 60%}
.heartspr img{width:100%}

.dg{position:absolute;z-index:11;transform:translate(-50%,-50%);font-weight:500;font-size:9.7cqw;line-height:1;color:var(--ink);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.dg span{display:inline-block}
.dg span.tick{animation:tick .5s cubic-bezier(.2,.8,.3,1)}
@keyframes tick{from{transform:translateY(-22%);opacity:.15}to{transform:none;opacity:1}}
a.btn{position:absolute;z-index:14;border-radius:999px;transform:translate(-50%,-50%);transition:background .3s;pointer-events:auto}
a.btn:hover,a.btn:focus-visible{background:rgba(123,27,32,.08);outline:none}

.cue{position:absolute;left:50%;bottom:3.5%;z-index:30;transform:translateX(-50%);color:#fff7e4;text-align:center;font-weight:600;font-size:3.8cqw;letter-spacing:.3em;text-transform:uppercase;
  background:#690a13;padding:1.6cqw 4cqw 1.4cqw;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.cue b{display:block;margin:1.2cqw auto 0;width:2.6cqw;height:2.6cqw;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(40%) rotate(45deg)}}

/* ---------- envelope ---------- */
#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#4a0710;transition:opacity .55s ease}
#dim{position:fixed;inset:0;z-index:50;background:#140104;opacity:0;pointer-events:none}
#intro.gone{opacity:0;pointer-events:none}
.env{position:relative;width:min(100vw,560px,calc(96svh * 1087 / 1446));aspect-ratio:1087/1446;perspective:1500px;container-type:inline-size}
.env>*{position:absolute}
.env .inside{inset:0;background:#5a0912}
.env .card{left:8%;top:3.5%;width:84%;z-index:2;clip-path:inset(-400% -10% 14% -10%)}
.env .card img{width:100%}
.env .front{inset:0;width:100%;height:100%;z-index:3}
.env .el,.env .sun{z-index:3;pointer-events:none}
.env .flapwrap{left:0;top:0;width:100%;height:76.49%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d}
.env .flapwrap img,.env .flapwrap .back{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.env .flapwrap .back{transform:rotateX(180deg);background:#e9dcc5;-webkit-mask:url(env_flap.webp) center/100% 100% no-repeat;mask:url(env_flap.webp) center/100% 100% no-repeat}
.env .fname{position:absolute;left:0;right:0;top:36.7%;transform:translateY(-50%);text-align:center;white-space:nowrap;font-family:var(--script);font-weight:500;font-size:8.6cqw;line-height:1.1;color:#9a6a1c;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none}
.env .fname b{font-weight:500;color:#c9a24a}
.env .seal{left:50%;top:68.1%;width:15%;aspect-ratio:1;z-index:5;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid #c9a24a;animation:ring 2.4s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.75);opacity:.95}100%{transform:translate(-50%,-50%) scale(1.35);opacity:0}}
.env .hint{left:0;right:0;top:56%;z-index:6;text-align:center;color:#8a5a1e;font-weight:600;font-size:3.7cqw;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;pointer-events:none;transition:opacity .5s}
.env .hint i{display:block;font-family:var(--script);font-style:normal;letter-spacing:0;text-transform:none;font-size:5.6cqw;font-weight:500;margin-top:.15em}
.tapzone{position:absolute;inset:0;z-index:7;cursor:pointer;background:none;border:0}

#music{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid #c9a24a;
  background:#4a0710;display:grid;place-items:center;cursor:pointer;color:var(--gold2);opacity:0;transition:opacity .8s}
#music.show{opacity:1}
#music svg{width:22px;height:22px}
#music .disc{animation:spin2 4s linear infinite;animation-play-state:paused}
#music.on .disc{animation-play-state:running}
#music .slash{display:none}
#music:not(.on) .slash{display:block}
@keyframes spin2{to{transform:rotate(360deg)}}
#prog{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(var(--colW) - 28px);z-index:56;display:flex;gap:4px;opacity:0;transition:opacity .8s;pointer-events:none}
#prog.show{opacity:1}
#prog i{flex:1;height:3px;border-radius:3px;background:rgba(70,12,12,.25);overflow:hidden;box-shadow:0 0 0 .5px rgba(255,240,210,.35)}
#prog i b{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a24a,#f3d79a)}
#ppill{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:57;padding:12px 22px;border-radius:999px;background:rgba(40,4,10,.78);color:#f3d79a;
  font:600 15px/1 var(--serif);letter-spacing:.18em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;white-space:nowrap}
#ppill.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#replay{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 56px);z-index:58;border:1px solid #c9a24a;background:#4a0710;color:#f3d79a;
  font:600 13px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;padding:11px 16px;box-shadow:0 4px 14px rgba(0,0,0,.3);border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s}
#replay.show{opacity:1;pointer-events:auto}
#nav{position:fixed;right:max(8px,calc((100vw - var(--colW))/2 - 26px));top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:11px;opacity:0;transition:opacity .8s}
#nav.show{opacity:1}
#nav button{width:7px;height:7px;border-radius:50%;border:1px solid #e6c071;background:transparent;cursor:pointer;position:relative;transition:all .4s}
#nav button.on{background:var(--gold2);transform:scale(1.5)}
#nav button span{position:absolute;right:16px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--script);font-size:22px;color:var(--gold2);opacity:0;transition:opacity .3s;pointer-events:none}
@media (hover:hover){#nav button:hover span{opacity:1}}
@media (max-width:540px){#nav{right:4px;gap:9px}#nav button{width:6px;height:6px}}
@media (prefers-reduced-motion:reduce){.spr img,.lamp,.sun,.peahead,.perch,.sway,.walk,.walk img,.shine img{animation:none!important}.script{clip-path:none}}
</style>
</head>
<body class="locked">
<div id="spacer"></div>
<div id="stage" aria-label="Wedding invitation of Apoorva and Armaan"></div>

<div id="dim" aria-hidden="true"></div>
<section id="intro" aria-label="Envelope">
  <div class="env" id="env">
    <div class="inside"></div>
    <div class="card" id="envcard"><img src="couple.webp" alt=""></div>
    <img class="front" src="env_base.webp" alt="">
    <div class="el sway" id="palmL" style="--amp:2.4deg;--sd:4.6s"><img src="a_env_palmL.webp" alt=""></div>
    <div class="el sway" id="palmR" style="--amp:2.2deg;--sd:5.3s;--sdl:-1.4s"><img src="a_env_palmR.webp" alt=""></div>
    <div class="el walk" id="eleE" style="--dist:9%;--wk:18s"><img src="a_env_ele.webp" alt=""></div>
    <div class="sun" id="envsun"><img src="env_sun.webp" alt=""></div>
    <div class="flapwrap" id="flap"><img src="env_flap.webp" alt=""><div class="fname">Apoorva <b>&amp;</b> Armaan</div><div class="back"></div></div>
    <div class="seal" id="seal"></div>
    <div class="hint" id="hint">Tap the seal</div>
    <button class="tapzone" id="open" aria-label="Open the invitation"></button>
  </div>
</section>

<button id="music" aria-label="Toggle music">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
    <g class="disc" style="transform-origin:12px 12px"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 5.5a6.5 6.5 0 0 1 6.5 6.5" opacity=".6"/></g>
    <path class="slash" d="M4 4l16 16"/>
  </svg>
</button>
<nav id="nav"></nav>
<div id="prog" aria-hidden="true"></div>

/* =================== BIRDS =================== */
function flyIn(s,stagger=320){
  const w=s.el.clientWidth,h=s.el.clientHeight;
  s.birds.forEach((b,i)=>{
    const dx=-b.face*w*rnd(.55,.85), dy=-h*rnd(.06,.2), r=b.face*-14, dur=rnd(2000,2800), delay=i*stagger+rnd(0,200);
    b.busy=true; b.el.classList.add('flying');
    b.el.animate([{transform:`translate(${dx}px,${dy}px) rotate(${r}deg) scale(.6)`,opacity:0},{opacity:1,offset:.2},
      {transform:`translate(${dx*.25}px,${dy*.2-h*.03}px) rotate(${r*.4}deg) scale(.95)`,offset:.7},{transform:'none',opacity:1}],
      {duration:dur,delay,easing:'cubic-bezier(.25,.6,.3,1)',fill:'forwards'});
    setTimeout(()=>{S.chirp(.07,(b.x-.5)*1.6); S.wings((b.x-.5)*1.6);},delay+200);
    setTimeout(()=>{b.el.classList.remove('flying');b.busy=false;},delay+dur);
  });
}
function flyAway(b){
  if(b.busy) return; b.busy=true; const s=b.sec,w=s.el.clientWidth,h=s.el.clientHeight;
  s.k==='venues'?S.parrot((b.x-.5)*1.6):S.chirp(.1,(b.x-.5)*1.6); S.wings((b.x-.5)*1.6); buzz(18);
  b.el.classList.add('flying');
  const a=b.el.animate([{transform:'none',opacity:1},{transform:`translate(${b.face*w*.3}px,${-h*.06}px) rotate(${b.face*-10}deg)`,offset:.35},
    {transform:`translate(${b.face*w*1.25}px,${-h*.22}px) rotate(${b.face*-18}deg) scale(.8)`,opacity:0}],{duration:1300,easing:'cubic-bezier(.4,0,.7,1)',fill:'forwards'});
  a.onfinish=()=>setTimeout(()=>{
    const dx=-b.face*w*.9;
    const c=b.el.animate([{transform:`translate(${dx}px,${-h*.12}px) rotate(${b.face*-12}deg) scale(.7)`,opacity:0},{opacity:1,offset:.2},{transform:'none',opacity:1}],{duration:2200,easing:'cubic-bezier(.2,.6,.3,1)',fill:'forwards'});
    setTimeout(()=>S.chirp(.05,(b.x-.5)*1.6),1500);
    c.onfinish=()=>{b.el.classList.remove('flying');b.busy=false;};
  },900);
}
/* a flock crossing any part of the card (panels and bridges alike) */
function flock(host,src,dir,n=3,vol=.045){
  const w=host.clientWidth, h=host.clientHeight; const y0=rnd(.12,.5)*h;
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='spr flying'; d.style.cssText=`opacity:1;pointer-events:none;left:${dir>0?-14:100}%;top:0;width:${(src.w*100*rnd(.55,.8)).toFixed(2)}%;z-index:9`;
    d.innerHTML=`<img src="${src.src}" alt="">`; (host.classList.contains('sec')?host.firstChild:host).appendChild(d);
    const yy=y0+i*h*.05+rnd(-8,8), dist=dir*w*1.3;
    d.animate([{transform:`translate(0,${yy}px)`,opacity:0},{opacity:.95,offset:.1},{transform:`translate(${dist*.5}px,${yy-h*.08}px)`,offset:.5},{transform:`translate(${dist}px,${yy-h*.03}px)`,opacity:.9}],
      {duration:rnd(5200,7000),delay:i*rnd(250,500),easing:'linear',fill:'both'}).onfinish=()=>d.remove();
  }
  S.chirp(vol,dir*-.7); setTimeout(()=>S.wings(0),300);
}

/* =================== LAYOUT: fit every phone =================== */
let HOLD=0, TRANS=0, SEG=0, CW=0, CH=0;
const N=SECTIONS.length;
function layout(){
  const vw=document.documentElement.clientWidth, vh=innerHeight;
  CW=Math.min(vw, Math.round(vh*.5625)); CH=vh;                // tall cards always fit; wider screens get a centred column
  document.documentElement.style.setProperty('--colW',CW+'px'); document.documentElement.style.setProperty('--stageH',CH+'px');
  SECTIONS.forEach(s=>{
    const sc=Math.max(CW/s.W, CH/s.T), w=s.W*sc, h=s.T*sc, l=(CW-w)/2, tp=(CH-h)/2;
    for(const el of [s.ext,s.el]) Object.assign(el.style,{left:l+'px',top:tp+'px',width:w+'px',height:h+'px'});
    s.geo={sc,l,tp}; capPaint(s);
  });
  if((Math.min(document.documentElement.clientWidth,innerHeight*.5625)/innerHeight<=.51?'tall':'std')!==SET && started===false) location.reload();
  HOLD=vh*.5; TRANS=vh*.85; SEG=HOLD+TRANS;
  const sp=$('#spacer'); sp.style.height=((N-1)*SEG+HOLD+vh)+'px';
  sp.innerHTML=SECTIONS.map((_,i)=>`<i class="snap" style="top:${yFor(i)}px"></i>`).join(''); render();
}
const yFor=i=>i*SEG+HOLD*.35;
/* the arch-shaped leading edge of each scene is painted from that scene's own artwork (mirrored), so the join is invisible */
function capPaint(s){
  const img=s.ext, cv=s.scene.querySelector('.cap canvas');
  if(!img.complete||!img.naturalWidth){ img.addEventListener('load',()=>capPaint(s),{once:true}); return; }
  const {sc,l,tp}=s.geo, dpr=Math.min(devicePixelRatio||1,2), w=CW, ch=Math.round(CW*.3);
  cv.width=Math.round(w*dpr); cv.height=Math.round(ch*dpr);
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,ch);
  const k=img.naturalWidth/s.W;                                   // artwork px per layout unit
  const arch=()=>{ x.beginPath(); x.moveTo(0,ch); x.lineTo(0,ch*22/30); x.bezierCurveTo(0,ch/3,w*.24,ch*.1,w/2,0); x.bezierCurveTo(w*.76,ch*.1,w,ch/3,w,ch*22/30); x.lineTo(w,ch); x.closePath(); };
  x.save(); arch(); x.clip();
  const sx=Math.max(0,-l)/sc*k, sy=Math.max(0,-tp)/sc*k, sw=w/sc*k, sh=ch/sc*k;
  x.translate(0,ch); x.scale(1,-1); x.drawImage(img,sx,sy,sw,sh,Math.min(0,l)<0?0:l,0,w,ch); x.restore();
  x.beginPath(); x.moveTo(0,ch*22/30); x.bezierCurveTo(0,ch/3,w*.24,ch*.1,w/2,0); x.bezierCurveTo(w*.76,ch*.1,w,ch/3,w,ch*22/30);
  x.strokeStyle='#d4af5f'; x.lineWidth=1.6; x.stroke();
}
/* page turns are driven frame-by-frame (not the browser's quick smooth-scroll), so each card glides in */
let glide=0, glideDone=null;
function smoothTo(y1,dur=1700,done){
  cancelAnimationFrame(glide); const html=document.documentElement; html.style.scrollSnapType='none';
  const y0=scrollY, t0=performance.now();
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    scrollTo(0,y0+(y1-y0)*e); if(k<1) glide=requestAnimationFrame(step); else { glide=0; html.style.scrollSnapType=''; const d=glideDone; glideDone=null; d&&d(); } };
  glideDone=done||null; glide=requestAnimationFrame(step);
}
function stopGlide(){ if(glide){ cancelAnimationFrame(glide); glide=0; document.documentElement.style.scrollSnapType=''; const d=glideDone; glideDone=null; d&&d(); } }
addEventListener('touchstart',stopGlide,{passive:true}); addEventListener('wheel',stopGlide,{passive:true});
function goTo(i,done){
  const cur=Math.round((scrollY-HOLD*.35)/SEG), y1=yFor(i);
  if(i===cur+1){ scrollTo(0,cur*SEG+HOLD); smoothTo(y1,1800,done); }      // skip the still part, glide through the turn
  else smoothTo(y1,Math.min(2600,900+Math.abs(i-cur)*500),done);
}
function activate(s){
  current=s; SECTIONS.forEach(x=>{x.dot.classList.toggle('on',x===s); x.scene.classList.toggle('cur',x===s);});
  const first=!s.el.classList.contains('in'); s.el.classList.add('in'); s.enter && s.enter(first);
  if(s!==SECTIONS[0]) SECTIONS[0].cue.style.opacity=0;
}
/* =================== THE EDIT: hold → title card → arch reveal =================== */
const ARCH=`url("data:image/svg+xml;utf8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" preserveAspectRatio="none"><path d="M0 130V62C0 34 22 14 50 0 78 14 100 34 100 62V130Z"/></svg>')}")`;
let cues={};
function render(){
  const y=scrollY, W=CW, H=CH;
  const i=Math.min(N-1,Math.max(0,Math.floor(y/SEG))), local=y-i*SEG;
  const t=i<N-1?clamp((local-HOLD)/TRANS):0, e=ease(t);
  inTransition=t>0&&t<1;
  SECTIONS.forEach((s,j)=>{ s.scene.classList.toggle('on',(j===i)||(j===i+1&&t>0)); if(j!==i&&j!==i+1){ s.scene.style.transform='none'; s.shade.style.opacity=0; } });
  const Aa=SECTIONS[i], B=SECTIONS[i+1];
  Aa.scene.style.transform=reduce?'none':`translate3d(0,${(-4*e).toFixed(2)}%,0) scale(${(1-.06*e).toFixed(4)})`;
  Aa.shade.style.opacity=(.5*smooth(0,.9,t)).toFixed(3);
  if(B){
    const capH=W*.3;
    B.scene.style.transform=`translate3d(0,${((1-e)*(H+capH)).toFixed(1)}px,0)`;
    B.shade.style.opacity=0;
  }
  if(!started) return;
  if(t>.05 && !cues[i+'a']){ cues[i+'a']=1; S.breeze(); S.chirp(.05,-.6); S.wings(-.3); }
  if(t>.3 && !cues[i+'b']){ cues[i+'b']=1; S.bell(1318.5,.04,1.8,0); }
  if(t<.02){ cues[i+'a']=cues[i+'b']=0; }
  const cur=(t>.55&&B)?B:Aa; if(current!==cur) activate(cur);
}
let raf=0, idle=0;
addEventListener('scroll',()=>{ if(!raf) raf=requestAnimationFrame(()=>{raf=0;render();});
},{passive:true});
let rz=0; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(layout,80); });
addEventListener('orientationchange',()=>setTimeout(layout,250));
addEventListener('keydown',e=>{ if(!started) return; const i=SECTIONS.indexOf(current);
  if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();goTo(Math.min(N-1,i+1));}
  if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();goTo(Math.max(0,i-1));} });
/* life between moments: birds lift off and settle back; nothing new is added */
setInterval(()=>{ if(!current||document.hidden||reduce||!started||inTransition) return;
  if(current.birds.length && Math.random()<.75){ takeOff(pick(current.birds)); }
  else if(current.id==='us'||current.id==='family') S.ghungroo(3,rnd(-.5,.5));
  else if(current.id==='forever' && Math.random()<.3) S.peacock();
},4800);

/* =================== ENVELOPE → FIRST SCENE =================== */
const song=$('#song'); song.volume=.55;
{ const E=META.env, A2=META.anim.env, place=(el,sp)=>Object.assign(el.style,{left:pc(sp.x,1087),top:pc(sp.y,1446),width:pc(sp.w,1087)});
  place($('#envsun'),E.sun); place($('#palmL'),A2.palmL); place($('#palmR'),A2.palmR); place($('#eleE'),A2.ele);
  $('#palmL').style.transformOrigin='45% 100%'; $('#palmR').style.transformOrigin='45% 100%'; }
function openEnvelope(){
  if(started) return; started=true; S.init(); buzz([25,40,25]);
  song.play().then(()=>$('#music').classList.add('on')).catch(()=>{});
  $('#hint').style.opacity=0; $('#seal').style.display='none'; $('#open').style.pointerEvents='none';
  S.whoosh();
  const flap=$('#flap'), card=$('#envcard'), env=$('#env'), dim=$('#dim'), q=reduce?.01:1;
  /* 1 · the flap lifts open */
  flap.animate([{transform:'rotateX(0)'},{transform:'rotateX(180deg)'}],{duration:900*q,easing:'cubic-bezier(.5,0,.25,1)',fill:'forwards'});
  setTimeout(()=>{ flap.style.zIndex=1; S.chime(); },480*q);
  /* 2 · the card peeks out of the envelope */
  setTimeout(()=>card.animate([{transform:'translateY(0)'},{transform:'translateY(-30%)'}],{duration:800*q,easing:'cubic-bezier(.3,0,.2,1)',fill:'forwards'}),850*q);
  /* 3 · the screen dims… */
  setTimeout(()=>dim.animate([{opacity:0},{opacity:1}],{duration:550*q,easing:'ease-in',fill:'forwards'}),1450*q);
  /* 4 · …and brightens on the invitation itself */
  setTimeout(()=>{
    $('#intro').style.transition='none'; $('#intro').classList.add('gone');
    document.body.classList.remove('locked'); scrollTo(0,yFor(0)); render(); activate(SECTIONS[0]);
    $('#music').classList.add('show'); $('#nav').classList.add('show');
    const a=dim.animate([{opacity:1},{opacity:0}],{duration:800*q,easing:'ease-out',fill:'forwards'}); a.onfinish=()=>{ dim.remove(); AUTO.start(); };
  },2050*q);
}
$('#open').addEventListener('pointerup',openEnvelope);
$('#open').addEventListener('click',openEnvelope);
document.addEventListener('keydown',e=>{ if(!started && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openEnvelope(); } });
history.scrollRestoration='manual'; scrollTo(0,0);
layout();
$('#music').addEventListener('click',()=>{
  S.init(); const on=!$('#music').classList.contains('on');
  if(on){ song.play().catch(()=>{}); S.setMuted(false);} else { song.pause(); S.setMuted(true);} $('#music').classList.toggle('on',on);
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) song.pause(); else if($('#music').classList.contains('on')&&started) song.play().catch(()=>{}); });

/* =================== AUTO-PLAY: each card holds, then the next one rises in =================== */
const AUTO=(()=>{
  const DUR={us:3.5,date:6,family:8,sagai:6,haldi:6,mehendi:6,wedding:8,venues:0};   // seconds per card (0 = last card, stop)
  const prog=$('#prog'), pill=$('#ppill'), rp=$('#replay');
  prog.innerHTML=SECTIONS.map(()=>'<i><b></b></i>').join('');
  const bars=[...prog.querySelectorAll('b')];
  let on=false, paused=false, el=0, last=0, idx=-1, moving=false, pillT=0;
  const flash=t=>{ pill.textContent=t; pill.classList.add('on'); clearTimeout(pillT); pillT=setTimeout(()=>pill.classList.remove('on'),1100); };
  function paint(i,f){ bars.forEach((b,k)=>b.style.width=(k<i?100:k===i?f*100:0)+'%'); }
  function frame(t){
    if(!on) return; requestAnimationFrame(frame);
    const dt=Math.min(.1,(t-(last||t))/1000); last=t;
    const i=SECTIONS.indexOf(current); if(i<0) return;
    if(i!==idx){ idx=i; el=0; rp.classList.toggle('show',DUR[current.id]===0); }
    const d=DUR[current.id];
    if(d===0){ paint(i,1); return; }
    if(!paused && !inTransition && !moving && !document.hidden) el+=dt;
    paint(i,Math.min(1,el/d));
    if(el>=d && !moving){ moving=true; goTo(i+1,()=>moving=false); }
  }
  function start(){ if(on) return; on=true; prog.classList.add('show'); last=0; requestAnimationFrame(frame); }
  function pause(show=true){ if(!paused){ paused=true; if(show) flash('❚❚  Paused'); } }
  function resume(){ if(paused){ paused=false; flash('▶  Playing'); } }
  function toggle(){ paused?resume():pause(); }
  /* a plain tap on the card toggles; touching anything interactive (directions, birds, dholak, music, dots) just pauses */
  const INTERACTIVE='a,button,.spr,.el,.hot,.lamp,.sun,.perch,.peahead,.heartspr';
  let sx=0, sy=0, moved=false, tStart=0;
  addEventListener('pointerdown',e=>{ if(!on) return; sx=e.clientX; sy=e.clientY; moved=false; tStart=Date.now();
    if(e.target.closest(INTERACTIVE) && !e.target.closest('#replay')) pause(false); },true);
  addEventListener('pointermove',e=>{ if(on && (Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)) moved=true; },true);
  addEventListener('pointerup',e=>{ if(!on||moved||Date.now()-tStart>600) return; if(e.target.closest(INTERACTIVE)) return; toggle(); },true);
  /* the guest scrolling or swiping on their own takes over from the timer */
  addEventListener('touchmove',()=>{ if(on && !moving) pause(); },{passive:true});
  addEventListener('wheel',()=>{ if(on && !moving) pause(); },{passive:true});
  addEventListener('keydown',e=>{ if(on && ['ArrowDown','ArrowUp','PageDown','PageUp',' '].includes(e.key)) pause(false); });
  rp.addEventListener('click',e=>{ e.stopPropagation(); rp.classList.remove('show'); paused=false; idx=-1; el=0; moving=true; goTo(0,()=>moving=false); });
  return {start,pause,resume};
})();
